# Moves the .claude/skills submodule in each repo listed in the repository variable
# SKILLS_BUMP_REPOS to the commit just pushed here. The variable is a JSON array,
# e.g. ["owner/notes", "owner/project"]. Add new project repos to it, not to this file.
# Needs the secret SKILLS_BUMP_TOKEN: a fine-grained token with Contents read and write
# on every repo in the list.
name: Bump skills submodule

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bump-skills
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(vars.SKILLS_BUMP_REPOS) }}
    steps:
      - name: Point submodule at ${{ github.sha }}
        env:
          TOKEN: ${{ secrets.SKILLS_BUMP_TOKEN }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ github.sha }}
          SUBMODULE: .claude/skills
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" target
          cd target
          current=$(git ls-tree HEAD "$SUBMODULE" | awk '{print $3}')
          if [ -z "$current" ]; then echo "No $SUBMODULE in $REPO"; exit 1; fi
          if [ "$current" = "$SHA" ]; then echo "$REPO already on $SHA"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --cacheinfo "160000,${SHA},${SUBMODULE}"
          git commit --quiet -m "Update skills to ${SHA::7}"
          for attempt in 1 2 3; do
            git push --quiet origin HEAD && exit 0
            git pull --quiet --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          exit 1
